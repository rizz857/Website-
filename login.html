<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ryu Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0b0f19; --card: #151d30; --primary: #0070f3; --accent: #00df89; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { background: var(--card); padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid #222f4c; text-align: center; }
        h2 { margin-bottom: 20px; font-weight: 800; background: linear-gradient(45deg, #0070f3, #00df89); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0b0f19; border: 1px solid #222f4c; border-radius: 8px; color: #fff; font-size: 1rem; }
        input:focus { border-color: var(--primary); outline: none; }
        .btn { width: 100%; background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .btn:hover { background: #00b36e; }
        .msg { margin-top: 15px; font-size: 0.9rem; font-weight: bold; }
        .switch { margin-top: 20px; font-size: 0.85rem; color: #8f9cae; }
        .switch a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Ryu Panel Store</h2>
        <p style="color: #8f9cae; font-size: 0.9rem; margin-bottom: 20px;">Silakan masuk untuk melanjutkan transaksi</p>
        
        <input type="email" id="email" placeholder="Masukkan Email">
        <input type="password" id="password" placeholder="Masukkan Password">
        <button class="btn" onclick="login()">Masuk</button>
        
        <p id="msg" class="msg"></p>
        
        <!-- Link kecil di bawah tombol -->
        <div class="switch">
            Belum punya akun? <a href="/register">Daftar disini</a>
        </div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token_pembeli', data.token);
                    msg.style.color = "#00df89";
                    msg.innerText = "Login sukses! Mengalihkan...";
                    setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
                } else {
                    msg.style.color = "#ff4a4a";
                    msg.innerText = data.error;
                }
            } catch (err) {
                msg.style.color = "#ff4a4a";
                msg.innerText = "Gagal terhubung ke server!";
            }
        }
    </script>
</body>
</html>
