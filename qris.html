<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran QRIS - Ryu Private Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #070a13;
            --card-bg: #111827;
            --primary: #0070f3;
            --accent: #00df89;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .payment-card {
            background: var(--card-bg);
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        
        .payment-header h2 { font-weight: 800; margin-bottom: 5px; }
        .payment-header p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; }
        
        .qr-container {
            background: #ffffff;
            padding: 15px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 20px;
            border: 4px solid var(--accent);
        }
        .qr-container img { width: 250px; height: 250px; display: block; }
        
        .order-details {
            background: #1f2937;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: left;
        }
        .detail-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        .detail-row:last-child { margin-bottom: 0; font-weight: 700; font-size: 1.1rem; color: var(--accent); border-top: 1px dashed #374151; padding-top: 8px; }
        
        .btn-back {
            display: block; width: 100%; background: #374151; color: white;
            text-decoration: none; padding: 12px; border-radius: 8px;
            font-weight: 600; transition: 0.2s;
        }
        .btn-back:hover { background: #4b5563; }
        
        .scan-text {
            font-size: 0.85rem; color: var(--accent); font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="payment-card">
        <div class="payment-header">
            <h2>Selesaikan Pembayaran</h2>
            <p>Scan QRIS di bawah ini menggunakan aplikasi M-Banking atau E-Wallet pilihanmu.</p>
        </div>

        <div class="qr-container">
            <img id="qr-image" src="" alt="Loading QR...">
        </div>

        <div class="scan-text">
            <i class="fas fa-mobile-alt"></i> Menunggu Pembayaran...
        </div>

        <div class="order-details">
            <div class="detail-row">
                <span style="color: var(--text-muted);">ID Transaksi</span>
                <span id="txt-order">INV-...</span>
            </div>
            <div class="detail-row">
                <span style="color: var(--text-muted);">Metode</span>
                <span>QRIS Semua Payment</span>
            </div>
            <div class="detail-row">
                <span>Total Bayar</span>
                <span id="txt-amount">Rp 0</span>
            </div>
        </div>

        <a href="/dashboard" class="btn-back"><i class="fas fa-arrow-left"></i> Kembali ke Dashboard</a>
    </div>

    <script>
        // Mengambil data dari URL parameter yang dikirim oleh dashboard.html
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order');
        const amount = urlParams.get('amount');
        const qrUrl = urlParams.get('qr');

        // Memasukkan data ke dalam halaman HTML
        if (orderId && amount && qrUrl) {
            document.getElementById('txt-order').innerText = orderId;
            // Format angka jadi Rupiah (Contoh: 10000 -> Rp 10.000)
            document.getElementById('txt-amount').innerText = 'Rp ' + parseInt(amount).toLocaleString('id-ID');
            document.getElementById('qr-image').src = qrUrl;
        } else {
            alert("Data transaksi tidak valid!");
            window.location.href = '/dashboard';
        }
    </script>
</body>
</html>
